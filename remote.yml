triggers:
  - trigger: mqtt
    topic: "{{ z2m_base_topic ~ '/' ~ z2m_device_name }}"
    id: z2m_action
  - trigger: state
    entity_id: !input power_light_schedule
    id: schedule_power_change
  - trigger: state
    entity_id: !input up_light_schedule
    id: schedule_up_change
  - trigger: state
    entity_id: !input down_light_schedule
    id: schedule_down_change
  - trigger: state
    entity_id: !input hue_light_schedule
    id: schedule_hue_change
  - trigger: state
    entity_id: !input power_light_adaptive_brightness
    id: adaptive_power_brightness_change
  - trigger: state
    entity_id: !input power_light_adaptive_color_temp
    id: adaptive_power_color_change
  - trigger: state
    entity_id: !input up_light_adaptive_brightness
    id: adaptive_up_brightness_change
  - trigger: state
    entity_id: !input up_light_adaptive_color_temp
    id: adaptive_up_color_change
  - trigger: state
    entity_id: !input down_light_adaptive_brightness
    id: adaptive_down_brightness_change
  - trigger: state
    entity_id: !input down_light_adaptive_color_temp
    id: adaptive_down_color_change
  - trigger: state
    entity_id: !input hue_light_adaptive_brightness
    id: adaptive_hue_brightness_change
  - trigger: state
    entity_id: !input hue_light_adaptive_color_temp
    id: adaptive_hue_color_change
actions:
  - alias: Skip press-only events
    condition: template
    value_template: |-
      {{ z2m_action not in ['on_press', 'up_press', 'down_press', 'off_press'] }}
  - alias: Z2M double press detection
    if:
      - "{{ trigger.id == 'z2m_action' }}"
      - "{{ command in ['power_short_release', 'up_short_release', 'down_short_release', 'hue_short_release'] }}"
      - "{{ not (event_button == 'up' and up_button_mode == 'brightness') and not (event_button == 'down' and down_button_mode == 'brightness') }}"
    then:
      - variables:
          detected_button: "{{ event_button }}"
          detected_z2m: "{{ z2m_button }}"
      - alias: Wait for second press
        wait_for_trigger:
          - trigger: mqtt
            topic: "{{ z2m_base_topic ~ '/' ~ z2m_device_name }}"
            value_template: "{{ value_json.action | default('') }}"
            payload: "{{ detected_z2m }}_press"
        timeout:
          milliseconds: 300
        continue_on_timeout: true
      - variables:
          command: |-
            {% if wait.trigger is not none %}{{ detected_button }}_double_press
            {% else %}{{ detected_button }}_short_release
            {% endif %}
      - alias: Consume Z2M second release after double press
        if: "{{ wait.trigger is not none }}"
        then:
          - wait_for_trigger:
              - trigger: mqtt
                topic: "{{ z2m_base_topic ~ '/' ~ z2m_device_name }}"
                value_template: "{{ value_json.action | default('') }}"
                payload: "{{ detected_z2m }}_press_release"
            timeout:
              milliseconds: 500
            continue_on_timeout: true
  - alias: Update last pressed helper for button commands
    if:
      - "{{ event_button != '' }}"
      - "{{ not (event_button == 'up' and up_button_mode == 'brightness') and not (event_button == 'down' and down_button_mode == 'brightness') }}"
    then:
      - action: input_text.set_value
        target:
          entity_id: "{{ last_pressed }}"
        data:
          value: "{{ event_button }}"
  - alias: Retarget last pressed helper to an on light group when dimming
    if:
      - "{{ prefer_on_lights }}"
      - "{{ (event_button == 'up' and up_button_mode == 'brightness') or (event_button == 'down' and down_button_mode == 'brightness') }}"
      - "{{ dim_button != '' }}"
      - "{{ dim_button != states(last_pressed) }}"
    then:
      - action: input_text.set_value
        target:
          entity_id: "{{ last_pressed }}"
        data:
          value: "{{ dim_button }}"
  - choose:
      - conditions:
          - "{{ trigger.id in ['adaptive_power_brightness_change', 'adaptive_power_color_change', 'adaptive_up_brightness_change', 'adaptive_up_color_change', 'adaptive_down_brightness_change', 'adaptive_down_color_change', 'adaptive_hue_brightness_change', 'adaptive_hue_color_change', 'schedule_power_change', 'schedule_up_change', 'schedule_down_change', 'schedule_hue_change'] }}"
        sequence:
          - if:
              - "{{ power_has_light }}"
              - "{{ power_light_auto_adjust_brightness or power_light_auto_adjust_color_temp }}"
              - "{{ power_adjustment_mode == 'adaptive' or (power_adjustment_mode == 'schedule' and power_schedule not in [none, '', []]) }}"
            then:
              - repeat:
                  for_each: "{{ power_light_entities }}"
                  sequence:
                    - if:
                        - "{{ is_state(repeat.item, 'on') }}"
                      then:
                        - choose:
                            - conditions: "{{ power_light_auto_adjust_brightness and power_light_auto_adjust_color_temp }}"
                              sequence:
                                - action: light.turn_on
                                  target:
                                    entity_id: "{{ repeat.item }}"
                                  data:
                                    brightness_pct: "{{ power_brightness_pct }}"
                                    color_temp_kelvin: "{{ power_color_temp_kelvin }}"
                                    transition: "{{ power_light_auto_adjust_transition }}"
                            - conditions: "{{ power_light_auto_adjust_brightness }}"
                              sequence:
                                - action: light.turn_on
                                  target:
                                    entity_id: "{{ repeat.item }}"
                                  data:
                                    brightness_pct: "{{ power_brightness_pct }}"
                                    transition: "{{ power_light_auto_adjust_transition }}"
                            - conditions: "{{ power_light_auto_adjust_color_temp }}"
                              sequence:
                                - action: light.turn_on
                                  target:
                                    entity_id: "{{ repeat.item }}"
                                  data:
                                    color_temp_kelvin: "{{ power_color_temp_kelvin }}"
                                    transition: "{{ power_light_auto_adjust_transition }}"
          - if:
              - "{{ up_has_light }}"
              - "{{ up_light_auto_adjust_brightness or up_light_auto_adjust_color_temp }}"
              - "{{ up_adjustment_mode == 'adaptive' or (up_adjustment_mode == 'schedule' and up_schedule not in [none, '', []]) }}"
            then:
              - repeat:
                  for_each: "{{ up_light_entities }}"
                  sequence:
                    - if:
                        - "{{ is_state(repeat.item, 'on') }}"
                      then:
                        - choose:
                            - conditions: "{{ up_light_auto_adjust_brightness and up_light_auto_adjust_color_temp }}"
                              sequence:
                                - action: light.turn_on
                                  target:
                                    entity_id: "{{ repeat.item }}"
                                  data:
                                    brightness_pct: "{{ up_brightness_pct }}"
                                    color_temp_kelvin: "{{ up_color_temp_kelvin }}"
                                    transition: "{{ up_light_auto_adjust_transition }}"
                            - conditions: "{{ up_light_auto_adjust_brightness }}"
                              sequence:
                                - action: light.turn_on
                                  target:
                                    entity_id: "{{ repeat.item }}"
                                  data:
                                    brightness_pct: "{{ up_brightness_pct }}"
                                    transition: "{{ up_light_auto_adjust_transition }}"
                            - conditions: "{{ up_light_auto_adjust_color_temp }}"
                              sequence:
                                - action: light.turn_on
                                  target:
                                    entity_id: "{{ repeat.item }}"
                                  data:
                                    color_temp_kelvin: "{{ up_color_temp_kelvin }}"
                                    transition: "{{ up_light_auto_adjust_transition }}"
          - if:
              - "{{ down_has_light }}"
              - "{{ down_light_auto_adjust_brightness or down_light_auto_adjust_color_temp }}"
              - "{{ down_adjustment_mode == 'adaptive' or (down_adjustment_mode == 'schedule' and down_schedule not in [none, '', []]) }}"
            then:
              - repeat:
                  for_each: "{{ down_light_entities }}"
                  sequence:
                    - if:
                        - "{{ is_state(repeat.item, 'on') }}"
                      then:
                        - choose:
                            - conditions: "{{ down_light_auto_adjust_brightness and down_light_auto_adjust_color_temp }}"
                              sequence:
                                - action: light.turn_on
                                  target:
                                    entity_id: "{{ repeat.item }}"
                                  data:
                                    brightness_pct: "{{ down_brightness_pct }}"
                                    color_temp_kelvin: "{{ down_color_temp_kelvin }}"
                                    transition: "{{ down_light_auto_adjust_transition }}"
                            - conditions: "{{ down_light_auto_adjust_brightness }}"
                              sequence:
                                - action: light.turn_on
                                  target:
                                    entity_id: "{{ repeat.item }}"
                                  data:
                                    brightness_pct: "{{ down_brightness_pct }}"
                                    transition: "{{ down_light_auto_adjust_transition }}"
                            - conditions: "{{ down_light_auto_adjust_color_temp }}"
                              sequence:
                                - action: light.turn_on
                                  target:
                                    entity_id: "{{ repeat.item }}"
                                  data:
                                    color_temp_kelvin: "{{ down_color_temp_kelvin }}"
                                    transition: "{{ down_light_auto_adjust_transition }}"
          - if:
              - "{{ hue_has_light }}"
              - "{{ hue_light_auto_adjust_brightness or hue_light_auto_adjust_color_temp }}"
              - "{{ hue_adjustment_mode == 'adaptive' or (hue_adjustment_mode == 'schedule' and hue_schedule not in [none, '', []]) }}"
            then:
              - repeat:
                  for_each: "{{ hue_light_entities }}"
                  sequence:
                    - if:
                        - "{{ is_state(repeat.item, 'on') }}"
                      then:
                        - choose:
                            - conditions: "{{ hue_light_auto_adjust_brightness and hue_light_auto_adjust_color_temp }}"
                              sequence:
                                - action: light.turn_on
                                  target:
                                    entity_id: "{{ repeat.item }}"
                                  data:
                                    brightness_pct: "{{ hue_brightness_pct }}"
