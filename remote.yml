  description: |-
    # Philips Hue Dimmer Switch RWL022 (Zigbee2MQTT)

    [![GitHub Repository](https://img.shields.io/badge/My%20GitHub-Repository-181717?style=for-the-badge&logo=github&logoColor=white)](https://github.com/danielpetrovic/home-assistant-config) [![Blueprint Code](https://img.shields.io/badge/View-Blueprint%20Code-2ea44f?style=for-the-badge&logo=homeassistant&logoColor=white)](https://github.com/danielpetrovic/home-assistant-config/blob/main/blueprints/automation/danielpetrovic/philips-hue-tap-dial-switch.yaml) [![Community](https://img.shields.io/badge/Community-Discussion-ff6600?style=for-the-badge&logo=discourse&logoColor=white)](https://community.home-assistant.io/t/philips-hue-tap-dial-switch-z2m-zha-custom-light-and-media-mode-rdm002/828766) ![Version](https://img.shields.io/badge/Version-2026.08.2-blue?style=for-the-badge)

    This blueprint enables comprehensive control of a Philips Hue Dimmer Switch through Zigbee2MQTT, focused on light automation.

    ## 🎛️ The Four Buttons
    Top to bottom, as labelled on the remote. The names in brackets are what the device
    reports on the wire, which is useful when reading logs.

    | Button | Wire name | Default behaviour |
    | --- | --- | --- |
    | Power | `on` | Normal button |
    | Brightness Up | `up` | Brightness control |
    | Brightness Down | `down` | Brightness control |
    | Hue | `off` | Normal button |

    ## ✨ Key Features
    - **4 Buttons**: Short press, long press and double press, with built-in light actions
    - **Light Mode**: Control lights with brightness, color temperature, and transitions. Adjustment Mode can apply static, adaptive, or schedule values, or keep the previous brightness and color temperature.
    - **Switchable Brightness Buttons**: Run the up/down buttons as dimmers, or as ordinary buttons with their own light actions
    - **Context-Aware Dimming**: In brightness mode the up/down buttons dim whichever button was last pressed, preferring a group that is still on when the last-pressed lights are off
    - **Hold to Ramp**: Holding a brightness button steps repeatedly until you let go, at a configurable speed
    - **Adaptive Lighting Support**: Time-based brightness and color temperature via schedule helpers and adaptive lighting sensors
    - **Auto-Adjust**: Automatically update lights when adaptive or schedule values change, independently for brightness and color temperature

    *Each configuration option below includes detailed instructions in the automation editor.*

    ## 📋 Requirements
    - **Home Assistant**: Version 2024.10.0 or later
    - **Zigbee2MQTT**: The device must be paired in Z2M and reachable on your MQTT broker
    - **Compatible Model**: Philips Hue Dimmer Switch, 2nd generation (RWL022)
    - **Text Helper**: One per switch, to track which button was last pressed

    ## ⚠️ Behaviour Notes
    - **Double press** is not reported by the device, so it is synthesised by waiting up to 300ms after a release to see whether a second press arrives. That wait delays every short release by up to 300ms. Brightness buttons skip it, so dimming stays immediate.
    - **The Hue button** reports as `off_press`. If you bind the device's scenes cluster to the coordinator it reports `recall_0`/`recall_1` instead; both are treated as a Hue button short release.
