    {% set last = states(last_pressed) %}
    {% set last = last if last in ['power', 'up', 'down', 'hue'] else '' %}
    {% if not prefer_on_lights %}
      {{ last }}
    {% else %}
      {% set ns = namespace(found='') %}
      {% for b in [last, 'power', 'hue', 'up', 'down'] %}
        {% if ns.found == '' and b != '' %}
          {% set ents = power_light_entities if b == 'power' else (up_light_entities if b == 'up' else (down_light_entities if b == 'down' else hue_light_entities)) %}
          {% if ents | select('is_state', 'on') | list | length > 0 %}
            {% set ns.found = b %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {{ ns.found if ns.found != '' else last }}
