blueprint:
  name: Lights on a Schedule
  description: >
    Apply two daily schedules to up to four lights. Optionally pair each
    light with a Zigbee2MQTT button action sensor that toggles that light.
  domain: automation

  input:
    schedule_1_action:
      name: Schedule 1 action
      selector:
        select:
          options:
            - Turn on
            - Turn off

    schedule_1_source:
      name: Schedule 1 time source
      selector:
        select:
          options:
            - Manual time
            - Sun event
            - Helper

    schedule_1_time:
      name: Schedule 1 manual time
      default: "07:00:00"
      selector:
        time:

    schedule_1_sun_event:
      name: Schedule 1 sun event
      default: sunrise
      selector:
        select:
          options:
            - sunrise
            - sunset

    schedule_1_sun_offset:
      name: Schedule 1 sun offset
      description: Use a duration such as 00:15:00 or -00:10:00.
      default: "00:00:00"
      selector:
        text:

    schedule_1_helper:
      name: Schedule 1 time helper
      default: ""
      selector:
        entity:
          domain: input_datetime

    schedule_2_action:
      name: Schedule 2 action
      selector:
        select:
          options:
            - Turn on
            - Turn off

    schedule_2_source:
      name: Schedule 2 time source
      selector:
        select:
          options:
            - Manual time
            - Sun event
            - Helper

    schedule_2_time:
      name: Schedule 2 manual time
      default: "22:00:00"
      selector:
        time:

    schedule_2_sun_event:
      name: Schedule 2 sun event
      default: sunset
      selector:
        select:
          options:
            - sunrise
            - sunset

    schedule_2_sun_offset:
      name: Schedule 2 sun offset
      description: Use a duration such as 00:15:00 or -00:10:00.
      default: "00:00:00"
      selector:
        text:

    schedule_2_helper:
      name: Schedule 2 time helper
      default: ""
      selector:
        entity:
          domain: input_datetime

    light_1:
      name: Light 1
      default: ""
      selector:
        entity:
          domain: light

    button_1:
      name: Light 1 button action sensor (optional)
      description: Select the Zigbee2MQTT action sensor, or leave blank.
      default: ""
      selector:
        entity:
          domain: sensor

    light_2:
      name: Light 2
      default: ""
      selector:
        entity:
          domain: light

    button_2:
      name: Light 2 button action sensor (optional)
      default: ""
      selector:
        entity:
          domain: sensor

    light_3:
      name: Light 3
      default: ""
      selector:
        entity:
          domain: light

    button_3:
      name: Light 3 button action sensor (optional)
      default: ""
      selector:
        entity:
          domain: sensor

    light_4:
      name: Light 4
      default: ""
      selector:
        entity:
          domain: light

    button_4:
      name: Light 4 button action sensor (optional)
      default: ""
      selector:
        entity:
          domain: sensor

mode: parallel
max: 10

trigger:
  - platform: time_pattern
    minutes: "/1"
    id: schedule

  - platform: event
    event_type: state_changed
    id: button

variables:
  schedule_1_action: !input schedule_1_action
  schedule_1_source: !input schedule_1_source
  schedule_1_manual: !input schedule_1_time
  schedule_1_sun_event: !input schedule_1_sun_event
  schedule_1_offset: !input schedule_1_sun_offset
  schedule_1_helper: !input schedule_1_helper

  schedule_2_action: !input schedule_2_action
  schedule_2_source: !input schedule_2_source
  schedule_2_manual: !input schedule_2_time
  schedule_2_sun_event: !input schedule_2_sun_event
  schedule_2_offset: !input schedule_2_sun_offset
  schedule_2_helper: !input schedule_2_helper

  lights:
    - !input light_1
    - !input light_2
    - !input light_3
    - !input light_4

  buttons:
    - !input button_1
    - !input button_2
    - !input button_3
    - !input button_4

  schedule_1_target: >-
    {% if schedule_1_source == 'Manual time' %}
      {{ today_at(schedule_1_manual).strftime('%H:%M') }}
    {% elif schedule_1_source == 'Helper' and schedule_1_helper != '' %}
      {{ today_at(states(schedule_1_helper)).strftime('%H:%M') }}
    {% elif schedule_1_source == 'Sun event' %}
      {% set attr = 'next_rising' if schedule_1_sun_event == 'sunrise'
         else 'next_setting' %}
      {% set event = as_datetime(state_attr('sun.sun', attr)) %}
      {% if event is not none %}
        {% set event = event if event.date() == now().date()
           else event - timedelta(days=1) %}
        {{ (event + (schedule_1_offset | trim | as_timedelta))
           .strftime('%H:%M') }}
      {% else %}
        unavailable
      {% endif %}
    {% else %}
      unavailable
    {% endif %}

  schedule_2_target: >-
    {% if schedule_2_source == 'Manual time' %}
      {{ today_at(schedule_2_manual).strftime('%H:%M') }}
    {% elif schedule_2_source == 'Helper' and schedule_2_helper != '' %}
      {{ today_at(states(schedule_2_helper)).strftime('%H:%M') }}
    {% elif schedule_2_source == 'Sun event' %}
      {% set attr = 'next_rising' if schedule_2_sun_event == 'sunrise'
         else 'next_setting' %}
      {% set event = as_datetime(state_attr('sun.sun', attr)) %}
      {% if event is not none %}
        {% set event = event if event.date() == now().date()
           else event - timedelta(days=1) %}
        {{ (event + (schedule_2_offset | trim | as_timedelta))
           .strftime('%H:%M') }}
      {% else %}
        unavailable
      {% endif %}
    {% else %}
      unavailable
    {% endif %}

  changed_entity: >-
    {% if trigger.id == 'button' %}
      {{ trigger.event.data.entity_id }}
    {% else %}
      {{ '' }}
    {% endif %}

  changed_action: >-
    {% if trigger.id == 'button' and trigger.event.data.new_state is not none %}
      {{ trigger.event.data.new_state.state }}
    {% else %}
      {{ '' }}
    {% endif %}

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'button' }}"
        sequence:
          - repeat:
              for_each: "{{ range(0, 4) | list }}"
              sequence:
                - if:
                    - condition: template
                      value_template: >-
                        {{ buttons[repeat.item] != ''
                           and changed_entity == buttons[repeat.item]
                           and changed_action not in
                             ['', 'unknown', 'unavailable', 'None']
                           and lights[repeat.item] != '' }}
                  then:
                    - service: light.toggle
                      target:
                        entity_id: "{{ lights[repeat.item] }}"

      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.id == 'schedule'
                 and schedule_1_target not in
                   ['unavailable', 'unknown', '']
                 and now().strftime('%H:%M') == schedule_1_target
                 and (lights | select('ne', '') | list | length > 0) }}
        sequence:
          - if:
              - condition: template
                value_template: "{{ schedule_1_action == 'Turn on' }}"
            then:
              - service: light.turn_on
                target:
                  entity_id: "{{ lights | select('ne', '') | list }}"
            else:
              - service: light.turn_off
                target:
                  entity_id: "{{ lights | select('ne', '') | list }}"

      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.id == 'schedule'
                 and schedule_2_target not in
                   ['unavailable', 'unknown', '']
                 and now().strftime('%H:%M') == schedule_2_target
                 and (lights | select('ne', '') | list | length > 0) }}
        sequence:
          - if:
              - condition: template
                value_template: "{{ schedule_2_action == 'Turn on' }}"
            then:
              - service: light.turn_on
                target:
                  entity_id: "{{ lights | select('ne', '') | list }}"
            else:
              - service: light.turn_off
                target:
                  entity_id: "{{ lights | select('ne', '') | list }}"
